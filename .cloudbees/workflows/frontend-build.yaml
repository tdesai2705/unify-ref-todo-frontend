apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow

name: Frontend CI Workflow

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  scm-token-own: read
  id-token: read

jobs:
  test:
    steps:
      - name: Checkout code
        uses: cloudbees-io/checkout@v1
        with:
          fetch-depth: 0

      - name: Validate Python files
        uses: docker://python:3.11
        run: |
          pip install Flask Jinja2
          python -m py_compile app/*.py
          echo "Python validation passed"

      - name: Publish test evidence
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Test Evidence - Todo Frontend
            - Run ID: ${{ cloudbees.run_id }}
            - Branch: ${{ cloudbees.scm.branch }}
            - Commit: ${{ cloudbees.scm.sha }}
            - Validation: Python syntax check
            - Status: SUCCESS ✅

  build:
    needs: test
    steps:
      - name: Checkout code
        uses: cloudbees-io/checkout@v1

      - name: Configure Docker credentials
        uses: cloudbees-io/configure-oci-credentials@v1
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: cloudbees-io/docker-build-push@v1
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: |
            tejasdesai27/todo-frontend:${{ cloudbees.scm.sha }}
            tejasdesai27/todo-frontend:latest

      - name: Publish build evidence
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Build Evidence - Todo Frontend
            - Run ID: ${{ cloudbees.run_id }}
            - Image: tejasdesai27/todo-frontend:${{ cloudbees.scm.sha }}
            - Registry: Docker Hub
            - Status: SUCCESS ✅
